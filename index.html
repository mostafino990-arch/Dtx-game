<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bostgame | Free Online Games</title>
<meta name="description" content="Bostgame - Play fun free online games directly in your browser.">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{background:#000}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Arial,sans-serif;
  color:#fff;background:#000;overflow-x:hidden;
}
.container{width:min(1180px,92%);margin:auto}
header{text-align:center;padding:52px 0 34px}
.logo{font-size:clamp(42px,8vw,82px);font-weight:800;letter-spacing:5px;color:#fff}
.subtitle{margin-top:10px;color:#8e8e93;font-size:clamp(14px,2.5vw,18px)}
.games{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:22px;padding:22px 0 55px;
}
.card{
  min-width:0;border:1px solid rgba(255,255,255,.10);
  border-radius:28px;padding:10px;background:rgba(255,255,255,.045);
  box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.08);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  transition:transform .25s ease,background .25s ease,border-color .25s ease;
}
.card:hover{transform:translateY(-6px);background:rgba(255,255,255,.065);border-color:rgba(255,255,255,.18)}
.card-inner{
  min-height:355px;border-radius:21px;padding:18px;background:rgba(18,18,18,.88);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}
.icon{
  width:100%;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;
  border-radius:18px;background:linear-gradient(145deg,#1c1c1e,#090909);
  border:1px solid rgba(255,255,255,.08);font-size:82px;margin-bottom:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
}
h2{font-size:24px;font-weight:750;margin-bottom:8px}
.card p{color:#98989f;line-height:1.45;margin-bottom:20px;font-size:14px;min-height:41px}
.play{
  width:74px;height:74px;margin-top:auto;display:flex;align-items:center;justify-content:center;
  text-align:center;text-decoration:none;color:#fff;font-weight:700;font-size:13px;
  border-radius:50%;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);
  box-shadow:0 8px 25px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.10);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  transition:transform .2s ease,background .2s ease;
}
.play:hover{transform:scale(1.08);background:rgba(255,255,255,.17)}
footer{text-align:center;color:#636366;padding:0 0 30px;font-size:12px}
@media(max-width:850px){.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}}
@media(max-width:560px){
  .container{width:94%}.games{grid-template-columns:1fr;gap:16px}
  .card-inner{min-height:330px}
}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="logo">BOSTGAME</div>
  <div class="subtitle">Play • Compete • Have Fun</div>
</header>

<main class="games">
  <article class="card">
    <div class="card-inner">
      <div class="icon">🏃‍♂️</div>
      <h2>Bost Runner</h2>
      <p>Run, jump and survive as long as you can.</p>
      <a class="play" href="runner.html">Play</a>
    </div>
  </article>

  <article class="card">
    <div class="card-inner">
      <div class="icon">🏎️</div>
      <h2>Neon Racing</h2>
      <p>Drive fast, dodge traffic and beat your score.</p>
      <a class="play" href="racing.html">Play</a>
    </div>
  </article>

  <article class="card">
    <div class="card-inner">
      <div class="icon">🎯</div>
      <h2>Target Rush</h2>
      <p>Hit the targets quickly and build your high score.</p>
      <a class="play" href="shooter.html">Play</a>
    </div>
  </article>
</main>

<footer>© 2026 Bostgame • Made for gamers</footer>
</div>
</body>
</html>
