<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bost Battle</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
body{touch-action:none}
#game{display:block;width:100%;height:100%;background:#101613}
.hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}
.pill{padding:9px 13px;border-radius:16px;background:rgba(15,15,15,.60);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
.small{font-size:10px;color:#929296;text-transform:uppercase;letter-spacing:1px}.big{font-size:17px;font-weight:800;margin-top:2px}
.zone{position:absolute;top:78px;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:14px;background:rgba(15,15,15,.58);border:1px solid rgba(255,255,255,.1);font-size:12px;color:#ddd}
.controls{position:absolute;left:0;right:0;bottom:18px;display:flex;justify-content:space-between;padding:0 16px;pointer-events:auto}
.pad{display:grid;grid-template-columns:54px 54px 54px;grid-template-rows:54px 54px;gap:6px}
.btn{width:54px;height:54px;border-radius:18px;background:rgba(20,20,20,.58);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.btn:active{background:rgba(255,255,255,.16);transform:scale(.95)}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.actions{display:flex;align-items:flex-end;gap:9px}
.action{width:70px;height:70px;border-radius:50%;font-size:12px;font-weight:800}
#shoot{background:rgba(255,255,255,.14)}
#loot{width:62px;height:62px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.62);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.panel{width:min(430px,90%);padding:28px;border-radius:28px;text-align:center;background:rgba(20,20,20,.88);border:1px solid rgba(255,255,255,.14);box-shadow:0 25px 80px #000}
h1{margin:0 0 8px;font-size:34px}.desc{color:#96969c;font-size:14px;line-height:1.5;margin-bottom:20px}
.start{width:100%;height:50px;border-radius:16px;border:1px solid rgba(255,255,255,.15);background:#fff;color:#000;font-weight:800;font-size:16px}
.hidden{display:none!important}
@media(min-width:800px){.controls{bottom:25px}.btn{width:48px;height:48px}.action{width:62px;height:62px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="top">
    <div class="pill"><div class="small">Players</div><div class="big" id="players">20</div></div>
    <div class="pill"><div class="small">Health</div><div class="big"><span id="hp">100</span>%</div></div>
    <div class="pill"><div class="small">Ammo</div><div class="big" id="ammo">30 / 120</div></div>
  </div>
  <div class="zone" id="zone">SAFE ZONE</div>

  <div class="controls">
    <div class="pad">
      <button class="btn" id="up">▲</button>
      <button class="btn" id="left">◀</button>
      <button class="btn" id="down">▼</button>
      <button class="btn" id="right">▶</button>
    </div>
    <div class="actions">
      <button class="btn action" id="loot">LOOT</button>
      <button class="btn action" id="shoot">FIRE</button>
    </div>
  </div>
</div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>BOST BATTLE</h1>
    <div class="desc">A compact battle-royale style arena with a shrinking zone, pickups and computer opponents. No gore, just frantic little rectangles trying to ruin your afternoon.</div>
    <button class="start" id="start">DROP IN</button>
  </div>
</div>

<div class="overlay hidden" id="end">
  <div class="panel">
    <h1 id="endTitle">MATCH OVER</h1>
    <div class="desc" id="endText"></div>
    <button class="start" id="again">PLAY AGAIN</button>
  </div>
</div>

<script>
(() => {
const c=document.getElementById("game"),ctx=c.getContext("2d");
let dpr=1,w=0,h=0,running=false,last=0,raf=0;
let keys={up:false,down:false,left:false,right:false,shoot:false,loot:false};
let cam={x:0,y:0},shots=[],loot=[],bots=[],particles=[];
const world={w:2600,h:1800};
const player={x:1300,y:900,r:18,hp:100,ammo:30,reserve:120,speed:250,cool:0};
const zone={x:1300,y:900,r:760,target:760,timer:65};

function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;c.style.width=w+"px";c.style.height=h+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function rand(a,b){return a+Math.random()*(b-a)}

function reset(){
 player.x=1300;player.y=900;player.hp=100;player.ammo=30;player.reserve=120;player.cool=0;
 zone.r=760;zone.timer=65;shots=[];particles=[];loot=[];bots=[];
 for(let i=0;i<19;i++){
  let x,y;do{x=rand(250,2350);y=rand(180,1620)}while(Math.hypot(x-1300,y-900)<250);
  bots.push({x,y,r:16,hp:100,cool:rand(.4,1.5),speed:rand(75,125),alive:true,dir:rand(0,6.28)});
 }
 for(let i=0;i<28;i++)loot.push({x:rand(180,2420),y:rand(150,1650),type:Math.random()<.5?"ammo":"med",taken:false});
}
function start(){reset();running=true;document.getElementById("menu").classList.add("hidden");document.getElementById("end").classList.add("hidden");last=performance.now();raf=requestAnimationFrame(loop)}
function end(win){running=false;document.getElementById("endTitle").textContent=win?"WINNER!":"MATCH OVER";document.getElementById("endText").textContent=win?"You cleared the arena. No need for dramatic victory speeches.":"You were eliminated. The rectangles have won this round.";document.getElementById("end").classList.remove("hidden")}
function worldToScreen(x,y){return [x-cam.x,y-cam.y]}
function circle(x,y,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function draw(){
 ctx.fillStyle="#101613";ctx.fillRect(0,0,w,h);
 cam.x=clamp(player.x-w/2,0,world.w-w);cam.y=clamp(player.y-h/2,0,world.h-h);
 ctx.save();ctx.translate(-cam.x,-cam.y);

 // ground grid
 ctx.strokeStyle="rgba(255,255,255,.035)";ctx.lineWidth=1;
 for(let x=0;x<world.w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,world.h);ctx.stroke()}
 for(let y=0;y<world.h;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(world.w,y);ctx.stroke()}

 // simple buildings
 for(let i=0;i<22;i++){
  const x=120+(i*421)%2250,y=120+(i*257)%1450,bw=90+(i*19)%120,bh=70+(i*31)%110;
  ctx.fillStyle="#171d1a";ctx.fillRect(x,y,bw,bh);
  ctx.strokeStyle="rgba(255,255,255,.06)";ctx.strokeRect(x,y,bw,bh);
 }

 // loot
 loot.forEach(l=>{if(l.taken)return;circle(l.x,l.y,11,l.type==="med"?"#ddd":"#777");ctx.fillStyle="#111";ctx.font="10px Arial";ctx.textAlign="center";ctx.fillText(l.type==="med"?"+":"A",l.x,l.y+4)});

 // zone
 ctx.fillStyle="rgba(0,0,0,.36)";ctx.fillRect(0,0,world.w,world.h);
 ctx.save();ctx.globalCompositeOperation="destination-out";ctx.beginPath();ctx.arc(zone.x,zone.y,zone.r,0,Math.PI*2);ctx.fill();ctx.restore();
 ctx.strokeStyle="rgba(255,255,255,.65)";ctx.lineWidth=5;ctx.beginPath();ctx.arc(zone.x,zone.y,zone.r,0,Math.PI*2);ctx.stroke();

 // shots
 shots.forEach(s=>{circle(s.x,s.y,4,"#fff")});

 // bots
 bots.forEach(b=>{if(!b.alive)return;circle(b.x,b.y,22,"#070707");circle(b.x,b.y,16,"#777");circle(b.x,b.y-3,7,"#aaa")});

 // player
 circle(player.x,player.y,25,"#070707");circle(player.x,player.y,19,"#fff");circle(player.x,player.y-4,8,"#222");
 ctx.restore();
}
function shoot(){
 if(!running||player.cool>0||player.ammo<=0)return;
 player.ammo--;player.cool=.18;
 const nearest=bots.filter(b=>b.alive).sort((a,b)=>dist(a,player)-dist(b,player))[0];
 let ang=nearest?Math.atan2(nearest.y-player.y,nearest.x-player.x):0;
 if(!nearest)ang=0;
 shots.push({x:player.x,y:player.y,vx:Math.cos(ang)*720,vy:Math.sin(ang)*720,life:.75});
}
function lootAction(){
 loot.forEach(l=>{
  if(!l.taken&&Math.hypot(l.x-player.x,l.y-player.y)<70){
   l.taken=true;
   if(l.type==="med")player.hp=Math.min(100,player.hp+25);
   else player.reserve=Math.min(180,player.reserve+30);
  }
 });
}
function update(dt){
 let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0);
 if(dx||dy){const m=Math.hypot(dx,dy);dx/=m;dy/=m;player.x+=dx*player.speed*dt;player.y+=dy*player.speed*dt}
 player.x=clamp(player.x,30,world.w-30);player.y=clamp(player.y,30,world.h-30);
 if(keys.shoot)shoot();
 if(keys.loot){lootAction();keys.loot=false}
 player.cool=Math.max(0,player.cool-dt);

 zone.timer-=dt;
 if(zone.timer<=0&&zone.r>260){zone.timer=12;zone.target=zone.r-85}
 if(zone.r>zone.target)zone.r=Math.max(zone.target,zone.r-7*dt);
 if(Math.hypot(player.x-zone.x,player.y-zone.y)>zone.r)player.hp-=8*dt;

 shots.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt});
 shots=shots.filter(s=>s.life>0&&s.x>0&&s.y>0&&s.x<world.w&&s.y<world.h);
 shots.forEach(s=>{
  bots.forEach(b=>{
   if(b.alive&&Math.hypot(s.x-b.x,s.y-b.y)<22){b.hp-=50;s.life=0;if(b.hp<=0)b.alive=false}
  });
 });
 bots.forEach(b=>{
  if(!b.alive)return;
  const d=dist(b,player);
  if(d<520){
   const a=Math.atan2(player.y-b.y,player.x-b.x);
   b.x+=Math.cos(a)*b.speed*dt;b.y+=Math.sin(a)*b.speed*dt;
   b.cool-=dt;
   if(b.cool<=0&&d<430){b.cool=rand(1.0,1.8);if(Math.random()<.45)player.hp-=rand(5,11)}
  }else{b.dir+=rand(-1,1)*dt;b.x+=Math.cos(b.dir)*b.speed*.35*dt;b.y+=Math.sin(b.dir)*b.speed*.35*dt}
  b.x=clamp(b.x,30,world.w-30);b.y=clamp(b.y,30,world.h-30);
 });
 if(player.hp<=0){player.hp=0;end(false)}
 const alive=bots.filter(b=>b.alive).length;
 document.getElementById("players").textContent=alive+1;
 document.getElementById("hp").textContent=Math.round(player.hp);
 document.getElementById("ammo").textContent=player.ammo+" / "+player.reserve;
 document.getElementById("zone").textContent=zone.r<=261?"FINAL ZONE":"ZONE: "+Math.ceil(zone.timer)+"s";
 if(alive===0)end(true);
}
function loop(t){if(!running)return;const dt=Math.min(.04,(t-last)/1000);last=t;update(dt);draw();raf=requestAnimationFrame(loop)}

function bind(id,key){const e=document.getElementById(id);const down=x=>{x.preventDefault();keys[key]=true};const up=x=>{x.preventDefault();keys[key]=false};e.addEventListener("pointerdown",down);["pointerup","pointercancel","pointerleave"].forEach(v=>e.addEventListener(v,up))}
bind("up","up");bind("down","down");bind("left","left");bind("right","right");bind("shoot","shoot");bind("loot","loot");
addEventListener("keydown",e=>{
 if(e.key==="w"||e.key==="ArrowUp")keys.up=true;if(e.key==="s"||e.key==="ArrowDown")keys.down=true;
 if(e.key==="a"||e.key==="ArrowLeft")keys.left=true;if(e.key==="d"||e.key==="ArrowRight")keys.right=true;
 if(e.key===" ")keys.shoot=true;if(e.key.toLowerCase()==="e")keys.loot=true;
});
addEventListener("keyup",e=>{
 if(e.key==="w"||e.key==="ArrowUp")keys.up=false;if(e.key==="s"||e.key==="ArrowDown")keys.down=false;
 if(e.key==="a"||e.key==="ArrowLeft")keys.left=false;if(e.key==="d"||e.key==="ArrowRight")keys.right=false;
 if(e.key===" ")keys.shoot=false;
});
document.getElementById("start").onclick=start;
document.getElementById("again").onclick=start;
reset();draw();
})();
</script>
</body>
</html>
