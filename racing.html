<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bostgame Racing 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif}
body{touch-action:none}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:#050505}
canvas{display:block;width:100%;height:100%;background:#0a0d13}
.hud{position:absolute;inset:0;pointer-events:none}
.top{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.panel{background:rgba(8,10,14,.48);border:1px solid rgba(255,255,255,.13);border-radius:17px;padding:8px 12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.stats{display:flex;gap:8px}
.k{font-size:9px;letter-spacing:1.4px;color:#aeb4bd;text-transform:uppercase}
.v{font-size:19px;font-weight:900;line-height:1.1;margin-top:2px}
.speed{min-width:128px;text-align:right}
.speed .v{font-size:26px}
.bottom{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:space-between;align-items:end;padding:0 18px}
.control{pointer-events:auto;width:76px;height:76px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(10,12,16,.48);color:#fff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:27px;font-weight:800;user-select:none;-webkit-user-select:none}
.control:active,.boost:active{transform:scale(.94);background:rgba(255,255,255,.16)}
.controls{display:flex;gap:12px}
.boost{pointer-events:auto;width:116px;height:54px;border-radius:19px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.10);color:#fff;font-weight:900;letter-spacing:1px;backdrop-filter:blur(14px);font-size:13px}
#nitro{position:absolute;left:50%;transform:translateX(-50%);bottom:19px;width:min(270px,36vw);height:8px;background:rgba(255,255,255,.12);border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#fff,#9ec8ff);border-radius:20px}
.center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.count{font-size:clamp(55px,10vw,120px);font-weight:1000;letter-spacing:-5px;text-shadow:0 12px 40px rgba(0,0,0,.5);opacity:0}
.overlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.42);backdrop-filter:blur(7px);z-index:5}
.card{width:min(430px,86vw);padding:28px;border-radius:28px;text-align:center;background:rgba(15,17,22,.82);border:1px solid rgba(255,255,255,.14);box-shadow:0 25px 80px rgba(0,0,0,.5)}
.card h1{margin:0 0 8px;font-size:34px}
.card p{margin:0 0 20px;color:#aeb4bd}
.play{border:0;border-radius:17px;padding:14px 28px;background:#fff;color:#000;font-size:16px;font-weight:900}
.note{position:absolute;left:50%;top:82px;transform:translateX(-50%);font-size:10px;letter-spacing:1.6px;color:rgba(255,255,255,.58);text-transform:uppercase}
@media(max-width:700px){
 .top{top:8px;left:8px;right:8px}.panel{padding:7px 9px}.stats{gap:5px}.speed .v{font-size:22px}.bottom{bottom:9px;padding:0 10px}.control{width:64px;height:64px}.boost{width:100px;height:48px}#nitro{bottom:17px}
}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div class="hud">
  <div class="top">
    <div class="stats">
      <div class="panel"><div class="k">Position</div><div class="v" id="pos">1 / 8</div></div>
      <div class="panel"><div class="k">Lap</div><div class="v" id="lap">1 / 3</div></div>
      <div class="panel"><div class="k">Time</div><div class="v" id="time">00:00</div></div>
    </div>
    <div class="panel speed"><div class="k">Speed</div><div class="v"><span id="speed">0</span> <small style="font-size:10px">KM/H</small></div></div>
  </div>
  <div class="note">AUTOMATIC • 3D RACING</div>
  <div id="nitro"><div id="nitroFill"></div></div>
  <div class="bottom">
    <div class="controls">
      <button class="control" id="left">‹</button>
      <button class="control" id="right">›</button>
    </div>
    <button class="boost" id="boost">NITRO</button>
  </div>
</div>
<div class="center"><div class="count" id="count">3</div></div>
<div class="overlay" id="overlay">
  <div class="card">
    <h1 id="result">FINISH</h1>
    <p id="resultText">Race complete.</p>
    <button class="play" id="restart">RACE AGAIN</button>
  </div>
</div>
</div>
<script>
(() => {
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1, running=false, finished=false;
let playerX=0, speed=0, nitro=100, distance=0, lap=1, startTime=0, last=0;
let steer=0, boost=false, roadScroll=0;
const totalDistance=30000;
const rivals=Array.from({length:7},(_,i)=>({x:(i%2?-.48:.48)*(0.35+Math.random()*.5), z:1200+i*820+Math.random()*600, lane:(i%3)-1, speed:.83+Math.random()*.14}));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize); resize();

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function shade(hex,amt){
 const n=parseInt(hex.slice(1),16),r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);
 return `rgb(${r},${g},${b})`;
}
function roadAt(z){
 const horizon=H*.36, bottom=H*1.03;
 const p=1-Math.exp(-z/1550);
 const y=lerp(bottom,horizon,p);
 const width=lerp(W*.93,W*.07,p);
 const center=W/2 + Math.sin((distance+z)*.00042)*W*.055*(1-p);
 return {y,width,center,p};
}
function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,H*.55);
 g.addColorStop(0,'#071321');g.addColorStop(.52,'#315878');g.addColorStop(1,'#b7a98c');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // sun
 const sg=ctx.createRadialGradient(W*.78,H*.18,4,W*.78,H*.18,Math.min(W,H)*.22);
 sg.addColorStop(0,'rgba(255,244,190,.9)');sg.addColorStop(1,'rgba(255,220,150,0)');
 ctx.fillStyle=sg;ctx.fillRect(0,0,W,H*.6);
 // distant hills
 ctx.fillStyle='#273d42';
 ctx.beginPath();ctx.moveTo(0,H*.42);
 for(let x=0;x<=W;x+=50)ctx.lineTo(x,H*.39+Math.sin(x*.008)*24+Math.sin(x*.021)*10);
 ctx.lineTo(W,H*.53);ctx.lineTo(0,H*.53);ctx.fill();
}
function drawWorld(){
 const horizon=H*.36;
 ctx.fillStyle='#33462e';ctx.fillRect(0,horizon,W,H-horizon);
 // road far-to-near
 const r0=roadAt(0), r1=roadAt(900), r2=roadAt(2600);
 ctx.fillStyle='#34383c';
 ctx.beginPath();ctx.moveTo(r0.center-r0.width/2,r0.y);ctx.lineTo(r0.center+r0.width/2,r0.y);ctx.lineTo(r2.center+r2.width/2,r2.y);ctx.lineTo(r2.center-r2.width/2,r2.y);ctx.closePath();ctx.fill();
 // roadside strips
 ctx.fillStyle='#8f8a72';
 ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(r2.center-r2.width/2,r2.y);ctx.lineTo(r0.center-r0.width/2,r0.y);ctx.lineTo(0,H);ctx.fill();
 ctx.beginPath();ctx.moveTo(W,horizon);ctx.lineTo(r2.center+r2.width/2,r2.y);ctx.lineTo(r0.center+r0.width/2,r0.y);ctx.lineTo(W,H);ctx.fill();
 // lane markings
 for(let z=120;z<2800;z+=210){
   const a=roadAt(z+roadScroll%210), b=roadAt(z+roadScroll%210+95);
   const lw=Math.max(2,10*(1-a.p));
   ctx.strokeStyle='rgba(255,255,255,.72)';ctx.lineWidth=lw;
   for(const f of [-.17,.17]){
     ctx.beginPath();ctx.moveTo(a.center+a.width*f,a.y);ctx.lineTo(b.center+b.width*f,b.y);ctx.stroke();
   }
 }
 // edge rumble strips
 for(let z=80;z<2800;z+=95){
   const a=roadAt(z+roadScroll%95);
   const s=Math.max(2,9*(1-a.p));
   ctx.fillStyle=((Math.floor(z/95)%2)===0)?'#fff':'#d21f2f';
   ctx.fillRect(a.center-a.width*.49,a.y-s*.5,a.width*.035,s);
   ctx.fillRect(a.center+a.width*.455,a.y-s*.5,a.width*.035,s);
 }
 drawScenery();
}
function drawScenery(){
 for(let i=0;i<26;i++){
   const z=(i*430+roadScroll*1.6)%2900+120;
   const a=roadAt(z), side=i%2?-1:1;
   const x=a.center+side*(a.width/2+lerp(18,120,a.p));
   const s=lerp(1.0,.12,a.p);
   if(s<.14)continue;
   // tree
   const trunk=34*s, crown=55*s;
   ctx.fillStyle='#4a3325';ctx.fillRect(x-trunk*.18,a.y-trunk*1.4,trunk*.36,trunk*1.4);
   ctx.fillStyle=i%3?'#173d2b':'#28533a';
   ctx.beginPath();ctx.arc(x,a.y-trunk*1.55,crown,0,Math.PI*2);ctx.fill();
   ctx.beginPath();ctx.arc(x-crown*.5,a.y-trunk*1.25,crown*.72,0,Math.PI*2);ctx.fill();
 }
 // billboards/buildings
 for(let i=0;i<7;i++){
   const z=(i*760+900+roadScroll*.7)%3600;
   const a=roadAt(z),side=i%2?-1:1,x=a.center+side*(a.width*.62);
   const s=lerp(.9,.08,a.p);
   if(s<.1)continue;
   const bw=90*s,bh=140*s;
   ctx.fillStyle='#6c7379';ctx.fillRect(x-bw/2,a.y-bh,bw,bh);
   ctx.fillStyle='#9fa8ad';ctx.fillRect(x-bw*.35,a.y-bh*.72,bw*.7,bh*.16);
   ctx.fillStyle='#1c2d3a';
   for(let q=0;q<3;q++)ctx.fillRect(x-bw*.35+q*bw*.25,a.y-bh*.5,bw*.11,bh*.16);
 }
}
function projectCar(x,z,scale=1){
 const a=roadAt(z);
 return {x:a.center+x*a.width*.72,y:a.y,s:lerp(1.15,.10,a.p)*scale};
}
function drawCar(x,z,color,player=false){
 const p=projectCar(x,z,player?1.18:1);
 const s=p.s, w=74*s,h=132*s;
 if(s<.05)return;
 ctx.save();ctx.translate(p.x,p.y);
 // shadow
 ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,-h*.06,w*.7,h*.12,0,0,Math.PI*2);ctx.fill();
 // body
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.moveTo(-w*.42,0);ctx.lineTo(-w*.5,-h*.28);ctx.lineTo(-w*.34,-h*.76);ctx.lineTo(-w*.18,-h);ctx.lineTo(w*.18,-h);ctx.lineTo(w*.34,-h*.76);ctx.lineTo(w*.5,-h*.28);ctx.lineTo(w*.42,0);ctx.closePath();ctx.fill();
 // highlights
 ctx.fillStyle=shade(color,30);ctx.beginPath();ctx.moveTo(-w*.34,-h*.76);ctx.lineTo(-w*.18,-h);ctx.lineTo(-w*.06,-h*.48);ctx.lineTo(-w*.34,-h*.34);ctx.closePath();ctx.fill();
 ctx.fillStyle='#10151b';
 ctx.beginPath();ctx.moveTo(-w*.23,-h*.72);ctx.lineTo(-w*.13,-h*.91);ctx.lineTo(w*.13,-h*.91);ctx.lineTo(w*.23,-h*.72);ctx.lineTo(w*.16,-h*.5);ctx.lineTo(-w*.16,-h*.5);ctx.closePath();ctx.fill();
 // lights
 ctx.fillStyle='#ff3c3c';ctx.fillRect(-w*.39,-h*.25,w*.13,h*.08);ctx.fillRect(w*.26,-h*.25,w*.13,h*.08);
 ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(-w*.29,-h*.43,w*.58,h*.035);
 if(player && boost){
   ctx.fillStyle='rgba(120,190,255,.75)';
   ctx.beginPath();ctx.moveTo(-w*.18,5);ctx.lineTo(-w*.07,5);ctx.lineTo(-w*.13,35+Math.random()*15);ctx.closePath();ctx.fill();
   ctx.beginPath();ctx.moveTo(w*.08,5);ctx.lineTo(w*.19,5);ctx.lineTo(w*.14,35+Math.random()*15);ctx.closePath();ctx.fill();
 }
 ctx.restore();
}
function drawRivals(){
 rivals.forEach(r=>{
   r.z-=speed*.58;
   if(r.z<80){r.z=2600+Math.random()*1200;r.x=(Math.random()*1.2-0.6);r.lane=Math.floor(Math.random()*3)-1}
   const x=r.lane*.25 + Math.sin((r.z+iSafe(r))*0.002)*.08;
   drawCar(x,r.z,['#d7d7d7','#343a40','#bdb5a0','#6b7785'][Math.floor(r.z/700)%4],false);
 });
}
function iSafe(r){return r.lane*33}
function update(dt){
 if(!running)return;
 speed=lerp(speed,boost&&nitro>0?225:158,1-Math.pow(.001,dt));
 if(boost&&nitro>0)nitro-=34*dt;else nitro=Math.min(100,nitro+8*dt);
 playerX+=steer*dt*(boost?1.05:0.9);
 playerX=clamp(playerX,-.68,.68);
 distance+=speed*dt;
 roadScroll+=speed*dt*2.4;
 if(distance>totalDistance){finish();return}
 lap=Math.min(3,Math.floor(distance/(totalDistance/3))+1);
 rivals.forEach(r=>{r.z-=speed*dt*.9});
 const t=(performance.now()-startTime)/1000;
 $('speed').textContent=Math.round(speed);
 $('nitroFill').style.width=nitro+'%';
 $('lap').textContent=lap+' / 3';
 $('time').textContent=new Date(t*1000).toISOString().slice(14,19);
}
function draw(){
 drawSky();drawWorld();
 // distant rivals first
 [...rivals].sort((a,b)=>b.z-a.z).forEach(r=>{
   const x=r.lane*.25+Math.sin(r.z*.002)*.08;
   drawCar(x,r.z,['#d7d7d7','#343a40','#bdb5a0','#68798a'][Math.floor(r.z/600)%4]);
 });
 drawCar(playerX,35,'#e8e8e8',true);
}
function loop(now){
 const dt=Math.min(.035,(now-last)/1000||0);last=now;
 update(dt);draw();requestAnimationFrame(loop);
}
function countdown(){
 const el=$('count');let n=3;el.style.opacity=1;el.textContent=n;
 const timer=setInterval(()=>{
   n--;
   if(n>0)el.textContent=n;
   else if(n===0){el.textContent='GO';}
   else{clearInterval(timer);el.style.opacity=0;running=true;startTime=performance.now();last=startTime}
 },650);
}
function finish(){
 running=false;finished=true;$('result').textContent='FINISH';
 $('resultText').textContent='Race complete • Time '+$('time').textContent;
 $('overlay').style.display='grid';
}
function restart(){
 playerX=0;speed=0;nitro=100;distance=0;lap=1;roadScroll=0;finished=false;
 rivals.forEach((r,i)=>{r.z=1200+i*820+Math.random()*600;r.lane=Math.floor(Math.random()*3)-1});
 $('overlay').style.display='none';$('time').textContent='00:00';countdown();
}
function bindHold(el,val){
 const on=e=>{e.preventDefault();steer=val};const off=e=>{e.preventDefault();if(steer===val)steer=0};
 el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('pointerleave',off);
}
bindHold($('left'),-1);bindHold($('right'),1);
$('boost').addEventListener('pointerdown',e=>{e.preventDefault();boost=true});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('boost').addEventListener(ev,e=>{e.preventDefault();boost=false}));
addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')steer=-1;
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')steer=1;
 if(e.code==='Space')boost=true;
});
addEventListener('keyup',e=>{
 if((e.key==='ArrowLeft'||e.key.toLowerCase()==='a')&&steer<0)steer=0;
 if((e.key==='ArrowRight'||e.key.toLowerCase()==='d')&&steer>0)steer=0;
 if(e.code==='Space')boost=false;
});
$('restart').addEventListener('click',restart);
restart();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
